<!doctype html>
<meta charset="utf-8">
<title>KORG DS-10 PLUS — decompiled</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; background: #14161a; color: #e6e6e6;
    font: 14px/1.5 system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 1rem;
    padding: 1.5rem 1rem;
  }
  h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
  p  { margin: 0; color: #9aa4b2; max-width: 40rem; text-align: center; }
  #ds { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  canvas {
    image-rendering: pixelated;
    width: 512px; height: 384px;
    background: #000; border-radius: 3px;
    box-shadow: 0 0 0 1px #2a2f37;
  }
  #bottom { cursor: crosshair; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: center; }
  select, button {
    background: #21252b; color: #e6e6e6; border: 1px solid #343a42;
    border-radius: 4px; padding: .3rem .6rem; font: inherit;
  }
  #status { font-family: ui-monospace, monospace; font-size: .8rem;
            color: #7d8794; min-height: 1.2em; }
  @media (max-width: 560px) { canvas { width: 256px; height: 192px; } }
</style>

<h1>KORG DS-10 PLUS &mdash; decompiled</h1>
<p>Both screens are drawn by a C reimplementation of the DS 2D graphics
hardware, compiled to WebAssembly, reading the game's own asset files.</p>

<div class="row">
  <label>bottom <select id="pick-bottom"></select></label>
  <label>top <select id="pick-top"></select></label>
</div>

<div id="ds">
  <canvas id="top" width="256" height="192"></canvas>
  <canvas id="bottom" width="256" height="192"></canvas>
</div>

<div id="status">loading&hellip;</div>
